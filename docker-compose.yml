version: '3.8'

services:


  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: magna-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-magna}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3001
      OIDC_DISCOVERY_URI: "https://orange-sso.example.com/.well-known/openid-configuration"
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-your-client-id}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-your-client-secret}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://localhost:3001/api/auth/oidc/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      LLM_PROXY_API_KEY: ${LLM_PROXY_API_KEY:-your-llm-proxy-api-key}
      LLM_PROXY_BASE_URL: ${LLM_PROXY_BASE_URL:-https://llmproxy.ai.orange}
      LLM_PROXY_DEFAULT_MODEL: ${LLM_PROXY_DEFAULT_MODEL:-vertex_ai/claude4-sonnet}

    networks:
      - magna-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Web App with Nginx
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: magna-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - magna-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  magna-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
